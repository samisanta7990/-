async function note(uid,text,ref,step){ // message to a customer; with ref+step it is also the saved progress mark
 if(!uid){alert('No user account found for this person.');return false}
 const{data,error}=await sb.rpc('notify_user',{p_user:uid,p_text:text,p_kind:'text',p_meta:ref?{adm:1,ref,step}:{adm:1}});
 if(error){alert('Failed: '+error.message);return false}pingPush(data);return true}
const act=async fn=>{if(BUSY)return;BUSY=1;try{await fn();await load()}catch(e){alert('Error: '+(e.message||e))}finally{BUSY=0;paint()}};

/* ---------- navigation ---------- */
function setNav(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function premFrame(f){try{const d=f.contentDocument;if(!d||!d.head||d.getElementById('pfx'))return;const st=d.createElement('style');st.id='pfx';st.textContent='@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes rpl{to{transform:scale(3.6);opacity:0}}@keyframes gShift{to{background-position:260% 0}}@keyframes bdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes ring{0%,100%{box-shadow:0 0 0 0 #F2B70566}60%{box-shadow:0 0 0 8px #F2B70500}}.btn{position:relative;overflow:hidden}.rpl{position:absolute;border-radius:50%;width:90px;height:90px;margin:-45px 0 0 -45px;background:radial-gradient(circle,#ffffff99,#ffffff00 70%);transform:scale(0);animation:rpl .65s ease-out forwards;pointer-events:none}.udot{animation:bdPulse 1.8s ease-in-out infinite}.mrow,.box.o,.box{animation:slideUp .45s both}.mrow{transition:transform .25s}.mrow:active{transform:scale(.98)}.mrow.xv{animation:slideUp .45s both,ring 2.4s ease-out infinite}h1{background:linear-gradient(100deg,#fff 0%,#ffe08a 40%,#F2B705 60%,#fff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gShift 5s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}';d.head.appendChild(st);d.addEventListener('pointerdown',function(e){const b=e.target.closest&&e.target.closest('.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),x=d.createElement('span');x.className='rpl';x.style.left=(e.clientX-r.left)+'px';x.style.top=(e.clientY-r.top)+'px';b.appendChild(x);setTimeout(function(){x.remove()},700)},{passive:true})}catch(e){}}
function fixMsgFrame(){try{const d=$('fm').contentDocument;if(!d||!d.head||d.getElementById('shellfix'))return;const st=d.createElement('style');st.id='shellfix';st.textContent='.cin{align-items:center!important}.cin input{flex:1!important;width:auto!important;margin:0!important;min-width:0!important;border-radius:24px!important}.cin .btn{width:46px!important;height:46px!important;flex:none!important;margin:0!important;padding:0!important;border-radius:50%!important;display:grid!important;place-items:center!important}.cin .btn::after{display:none!important}.chh .btn{width:auto!important;margin:0!important}.cms{padding-bottom:130px!important}';d.head.appendChild(st)}catch(e){}}
function frame(id,src){const f=$(id);if(f.getAttribute('src')!==src)f.src=src;return f}
function go(t,hash){if(['home','coins','sales','swaps','chat'].includes(t))t='todo';cur=t;setNav(t);const fr=t==='chat'||t==='classic';
 $('v').hidden=fr;$('fm').hidden=t!=='chat';$('fo').hidden=t!=='classic';
 if(t==='chat')frame('fm','/adminmsg.html?v='+BUILD);
 if(t==='classic')frame('fo','/admin.html?v='+BUILD+'#'+(hash||'delivered'));
 if(!fr){$('v').scrollTop=0;if(t==='rpt')RC=null;paint();const v=$('v');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');clearTimeout(window.ENT);window.ENT=setTimeout(()=>v.classList.remove('enter'),900)}
 history.replaceState(null,'','#'+(t==='classic'?'more':t))}
function paint(){if(!ME)return;const a=document.activeElement;if(a&&a.closest&&a.closest('#v')&&/INPUT|TEXTAREA/.test(a.tagName))return;
 const y=$('v').scrollTop;if(cur==='rpt'){if(!RC)rptLoad();sheetPaint();return}({todo,hist,more}[cur]||(()=>{}))();sheetPaint();$('v').scrollTop=y}
async function tick(){if(!ME||document.hidden)return;try{await load();if(cur==='todo')await swapRefresh();paint()}catch(e){}}
function tg(id){OPEN[id]=!OPEN[id];if(OPEN[id]&&cur==='todo')swapRefresh().then(paint);paint()}

/* ---------- FULL-SCREEN ORDER DETAIL ---------- */
const RCU={};
async function rcLoad(o){if(!o.receipt_path||RCU[o.id]!==undefined)return;RCU[o.id]=null;try{const{data}=await sb.storage.from('receipts').createSignedUrl(o.receipt_path,3600);RCU[o.id]=data?data.signedUrl:''}catch(e){RCU[o.id]=''}sheetPaint(true)}
function custStats(o){const l=D.orders.filter(x=>o.user_id?x.user_id===o.user_id:x.phone===o.phone),ok=l.filter(x=>['approved','delivered'].includes(x.status));
 return{n:l.length,done:l.filter(x=>x.status=='delivered').length,spent:ok.reduce((s,x)=>s+(+x.amount||0),0),first:l.reduce((m,x)=>!m||x.created_at<m?x.created_at:m,null)}}
const dfmt=t=>t?new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const kv=(l,v,c)=>`<div class="kv"><small>${l}</small><div class="kvv">${v}${c?' '+cpB(c):''}</div></div>`;
function coinDetail(o){
 const jp=/japan/i.test((o.product||'')+' '+(o.package||'')),ct=jp?2:1,mine=o.claimed_by&&ME&&o.claimed_by===ME.id,rd=D.ready[o.code];
 const sp=(o.info||'').indexOf(' '),em=sp>0?o.info.slice(0,sp):'',pw=sp>0?o.info.slice(sp+1):(o.info||''),cs=custStats(o),tgu=String(o.tg||'').replace(/^@/,'');
 const paid=['approved','delivered'].includes(o.status),done=o.status=='delivered';
 const [stT,stC]=coinStat(o);
 if(o.receipt_path)rcLoad(o);
 let b='';
 b+=`<div class="dc"><div class="dl">CUSTOMER</div><div class="who"><div class="av">${E((tgu||o.phone||'?').slice(0,1).toUpperCase())}</div><div><div class="big">${E(o.phone||'—')} ${o.phone?cpB(o.phone):''}</div>${o.tg?`<a class="lnk" href="https://t.me/${E(tgu)}" target="_blank">✈️ ${E(o.tg)}</a>`:'<small class="sub">No Telegram</small>'}</div></div>
  <div class="chips"><span>🛒 ${cs.n} order${cs.n==1?'':'s'}</span><span>✅ ${cs.done} delivered</span><span>💰 ${nf(cs.spent)} ETB</span>${cs.first?`<span>📅 since ${new Date(cs.first).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>`:''}</div>
  ${o.phone?`<div class="row2" style="margin-top:12px"><a class="btn s ab" href="tel:${E(o.phone)}">📞 Call</a>${o.tg?`<a class="btn s ab" target="_blank" href="https://t.me/${E(tgu)}">✈️ Telegram</a>`:''}</div>`:''}</div>`;
 b+=`<div class="dc"><div class="dl">ORDER #${o.id}</div><div class="big">${E(o.package||o.product)} <small class="sub">${jp?'Japan':'All Region'}</small></div><div class="amt">${E(o.amount)} ETB</div>
  ${kv('Placed',dfmt(o.created_at)+' · '+ago(o.created_at))}${o.tx_ref?kv('Telebirr no.',E(o.tx_ref),o.tx_ref):''}${o.promo?kv('Promo',E(o.promo)+(o.discount?' · −'+E(o.discount)+' ETB':'')):''}${o.auto_note?`<div class="note">🤖 ${E(o.auto_note)}</div>`:''}</div>`;
 if(o.receipt_path){const u=RCU[o.id];b+=`<div class="dc"><div class="dl">PAYMENT RECEIPT</div>${u?`<a href="${u}" target="_blank"><img class="rimg" src="${u}"></a>`:u===''?'<small class="sub">Could not open the receipt</small>':'<small class="sub">⏳ Loading receipt…</small>'}${o.status=='awaiting_review'?`<div class="row2" style="margin-top:10px">${bt('🔍 Check with Telebirr',`chk(${o.id},this)`)}</div><div id="rc${o.id}"></div>`:''}</div>`}
 if(paid||o.status=='awaiting_review'){b+=`<div class="dc"><div class="dl">CUSTOMER LOGIN</div>${o.relogin?'<div class="warn">⏳ Waiting for the customer to send the login again</div>':(em||pw)?kv('Email',E(em||'—'),em)+kv('Password',E(pw||'—'),pw):'<small class="sub">⏳ Not received</small>'}${paid&&!done?(rd?'<div class="okb">🟢 Customer is ready</div>':'<small class="sub">Customer has not said ready yet</small>'):''}</div>`}
 if(paid){b+=`<div class="dc"><div class="dl">KONAMI CODE ${ct}</div>${o.kcode?`<div class="bigcode">${E(o.kcode)} ${cpB(o.kcode)}</div>`:o.code_req?'<div class="warn">⏳ Customer is sending the code…</div>':'<small class="sub">Not requested yet</small>'}</div>`}
 if(done){b+=`<div class="dc"><div class="dl">DELIVERED</div>✅ Done${o.proof?`<img class="rimg" src="${CFG.URL}/storage/v1/object/public/proofs/${E(o.proof)}">`:''}</div>`}
 if(o.status=='approved'&&mine&&o.kcode)b+=`<div class="dc"><div class="dl">DELIVERY PROOF (optional)</div><input type="file" accept="image/*" id="pf${o.id}"></div>`;
 let bar='';
 if(o.status=='awaiting_review')bar=`<div class="abr">${bt('✅ Approve payment',`ordAct(${o.id},'ok')`,'')}${bt('❌ Reject',`ordAct(${o.id},'no')`)}</div>`;

function dealCase(d){
 const id='d'+d.id,sec=d.secrets||{},S1=sec.seller||{},B1=sec.buyer||{},st=d.status,closed=['done','declined','cancelled'].includes(st);
 const n=['requested','login','ask1','code1','verify','code3','pay','handover','done'].indexOf(st);const stage=(k)=>n>k?'done':n==k?'now':'todo';
 const who=(side)=>side=='seller'?`Owner: ${E(d.seller_name||'eFootballET')}`:`${d.kind=='buy'?'Buyer':'Swapper'}: ${E(d.buyer_name||'')} ${E(d.phone||'')}`;

 if(d.kind=='swap'&&(off.images||[]).length)b+=`<div class="row">${bt('🖼 Swapper screenshots',`dlImgs(${d.id},this)`)}</div><div id="di${d.id}"></div>`;

 b+=stp(2,'Login'+(d.kind=='swap'?'s':''),n>1?'done':(n==1?'now':'todo'),`${sideSec('Owner account',S1)}${d.kind=='swap'?sideSec('Swapper account',B1):''}`);
 b+=stp(3,'Ask Code 1',n>2?'done':(n==2?'now':'todo'),st=='ask1'?`<small class="sub">Request the Data Transfer code on Konami with the login above, then press:</small><div class="row">${bt('🔐 Konami sent Code 1 — ask customer',`dlAct(${d.id},'ask1')`,'')}</div>`:(n>2?'✅ Done':'<small class="sub">After both logins arrive</small>'));
 b+=stp(4,'Verified',n>4?'done':(n==4?'now':'todo'),st=='verify'?`<small class="sub">Code 1 received. Check the account, then:</small><div class="row">${bt('✅ Verified — account is OK',`dlAct(${d.id},'verified')`,'')}</div>`:(n>4?'✅ Verified':'<small class="sub">After Code 1</small>'));
 b+=stp(5,'Code 3 · Email change',n>5?'done':(n==5?'now':'todo'),n>5?'✅ Received':n==5?'⏳ Waiting for the customer (they were notified)':'<small class="sub">After Verified</small>');
 const pays=(d.pays||[]);
 b+=stp(6,'Payment',n>6?'done':(n==6?'now':'todo'),pays.length?pays.map(p=>`<div class="pp">${p.side=='buyer'?(d.kind=='buy'?'Buyer':'Swapper'):'Owner'} pays <b>${E(p.due)} ETB</b> · ${p.ok?'✅ confirmed':p.order_status=='awaiting_review'?'🔎 receipt sent':p.order_status=='rejected'?'❌ rejected':p.order_code?'⏳ not paid yet':'⏳ not started'}${p.order_status=='awaiting_review'?`<div class="row">${bt('✅ Approve',`ordAct(${p.order_id},'ok')`,'')}${bt('❌ Reject',`ordAct(${p.order_id},'no')`)}</div>`:''}${p.receipt?`<div class="row">${bt('🖼 Receipt',`rcpt(${p.order_id},this)`)}</div><div id="rc${p.order_id}"></div>`:''}</div>`).join(''):'<small class="sub">After Code 3</small>');
 b+=stp(7,'Hand over & close',st=='done'?'done':(st=='handover'?'now':'todo'),st=='done'?'✅ Completed':st=='handover'?`<small class="sub">Move the account to the customer's login, then press:</small><div class="row">${bt('🎉 Handed over — complete',`dlAct(${d.id},'complete')`,'')}</div>`:'<small class="sub">After payment</small>');
 if(!closed)b+=`<div class="row">${bt('🗑 Cancel deal',`dlCancel(${d.id})`)}</div>`;
 const badge=st=='done'?chip('✅ Done','g'):st=='declined'||st=='cancelled'?chip('❌ '+DLSTEP[st],'r'):chip(DLSTEP[st],['ask1','verify','handover'].includes(st)?'g':'');

/* ---------- SWAPS (C owner, F requester) ---------- */
function swapCases(){
 const by={};[...D.xm].reverse().forEach(m=>{(by[m.conv_id]=by[m.conv_id]||[]).push(m)});const out=[];
 for(const cid in by){const ms=by[cid];let last=null,acc=null,off=null;
  ms.forEach(m=>{if(m.kind=='exchange_offer'){last='o';off=m}else if(m.kind=='exchange_accept'){last='a';acc=m}else if(m.kind=='exchange_decline')last='d'});
  if(last!=='a'||!acc)continue;const ref='x'+cid,M=mk(ref);if(M.done)continue;
  const cv=(D.conv||[]).find(c=>c.id==cid)||{},C=acc.sender_id||cv.seller_id||null,F=(off&&off.sender_id)||cv.buyer_id||null;
  const after=ms.filter(m=>m.id>acc.id);let payer=null,declined=false;
  after.forEach(m=>{if(m.kind=='fee_sender'){payer=m.sender_id;declined=false}else if(m.kind=='fee_agree'){payer=m.sender_id;declined=false}else if(m.kind=='fee_decline'){payer=null;declined=true}});
  out.push({cid:+cid,ref,M,C,F,offer:(off&&off.meta)||{},acc,unlocked:after.some(m=>m.kind=='verify_done'),payer,declined,asked:after.some(m=>m.kind=='fee_ask')&&!payer})}
 return out.sort((a,b)=>b.cid-a.cid)}
function supOf(uid){if(!uid)return null;const c=(D.conv||[]).find(x=>x.kind==='support'&&x.buyer_id===uid);return c?c.id:(XS.sup[uid]||null)}
const nameOf=uid=>{const s=supOf(uid),c=s&&D.convs.find(x=>x.id==s);return(c&&pkey(c.title))||(uid?String(uid).slice(0,6):'?')};
async function findSup(uid){if(!uid||supOf(uid))return;const sups=D.convs.filter(c=>isSupT(c.title)).map(c=>c.id);if(!sups.length)return;const{data}=await sb.from('messages').select('conv_id').eq('sender_id',uid).in('conv_id',sups).limit(1);if(data&&data[0])XS.sup[uid]=data[0].conv_id}
async function partyLoad(uid,since,ref){await findSup(uid);const sup=supOf(uid);if(!sup)return;
 const{data}=await sb.from('messages').select('id,kind,meta,created_at,body').eq('conv_id',sup).order('id',{ascending:false}).limit(300);const ms=(data||[]).reverse().filter(m=>new Date(m.created_at)>=new Date(since)-60000);
 const P={sup,login:null,codes:{}};let lastCt=null;
 for(const m of ms){if(m.meta&&m.meta.step==='ctype'&&m.meta.ref===ref){lastCt=m.meta.ctype;continue}
  if(m.kind=='vr_ask'&&m.meta){const an=ms.find(x=>x.kind=='vr_answer'&&x.meta&&x.meta.req==m.meta.req),r={req:m.meta.req,at:m.created_at,ans:an?an.created_at:null};if(m.meta.want=='login')P.login=r;else if(lastCt){P.codes[lastCt]=r;lastCt=null}}}
 const need=[P.login,...Object.values(P.codes)].filter(r=>r&&r.ans&&!XS.val[r.req]);
 for(const r of need){const g=await sb.rpc('admin_vr_get',{p_req:r.req});if(!g.error&&g.data)XS.val[r.req]=g.data}
 XS.party[uid+':'+ref]=P}
async function swapRefresh(){const cs=swapCases();await Promise.all(cs.filter(c=>OPEN['x'+c.cid]).flatMap(c=>[partyLoad(c.C,c.acc.created_at,c.ref),partyLoad(c.F,c.acc.created_at,c.ref)]))}
async function vrAsk(uid,want,ct,ref){act(async()=>{await findSup(uid);const sup=supOf(uid);if(!sup){alert('This person has no Support chat yet. Ask them to open Messages > Support and send "Hi".');return}
 if(want=='code'){const e=await sb.rpc('send_message',{p_conv:sup,p_body:CASK[ct],p_meta:{adm:1,ref,step:'ctype',ctype:ct}});if(e.error){alert('Failed: '+e.error.message);return}}
 const{data:mid,error}=await sb.rpc('admin_vr_ask',{p_conv:sup,p_want:want});if(error){alert('Error: '+error.message);return}pingPush(mid);const cs=swapCases().find(x=>x.ref===ref);await partyLoad(uid,cs?cs.acc.created_at:0,ref)})}
async function xUnlock(cid){if(!confirm('Open the payment step for both users?'))return;act(async()=>{const{data,error}=await sb.rpc('send_message',{p_conv:cid,p_body:'verified',p_kind:'verify_done'});if(error){alert('Could not unlock: '+error.message);return}pingPush(data)})}
async function xPaid(cid){const c=swapCases().find(x=>x.cid==cid);if(!c||!confirm('Payment received? Both users will be told.'))return;act(async()=>{
 const t='✅ Payment received. eFootballET will now ask you for your account login and codes in Support chat.';await note(c.C,t,c.ref,'paid');await note(c.F,t)})}
async function xDone(cid){const c=swapCases().find(x=>x.cid==cid);if(!c||!confirm('Mark this swap as completed?'))return;act(async()=>{
 const t='🎉 Your account swap is completed. Thank you for using eFootballET!';await note(c.C,t,c.ref,'done');await note(c.F,t)})}
function partyBlock(c,who,uid){
 const P=XS.party[uid+':'+c.ref]||{},lg=P.login,lv=lg&&lg.ans?XS.val[lg.req]:null,nm=nameOf(uid);
 const codeRow=n=>{const r=(P.codes||{})[n],v=r&&r.ans?XS.val[r.req]:null;return `<div style="margin-top:6px"><b>Code ${n}</b> · ${CT[n]}${v&&v.code?`<div>${codeH(v.code,r.ans)}</div>`:r?`<div>⏳ Waiting… (${ago(r.at)})</div>`:''}<div class="row">${bt(r?`🔁 Ask Code ${n} again`:`🔐 Ask ${who} for Code ${n}`,`vrAsk('${uid}','code',${n},'${c.ref}')`)}</div></div>`};
 const [e,p]=lv?[lv.email,lv.pass]:['',''];
 return `<div class="pp"><b>${who} · ${E(nm)}</b>${!supOf(uid)?'<div>⚠️ No Support chat yet</div>':''}
  <div>${lv&&(e||p)?loginH(e,p):lg?`<div>⏳ Waiting for login… (${ago(lg.at)})</div>`:'<small class="sub">Login not asked yet</small>'}</div>
  <div class="row">${bt(lg?'🔁 Ask login again':`🔑 Ask ${who} for email + password`,`vrAsk('${uid}','login',0,'${c.ref}')`)}</div>${codeRow(2)}${codeRow(3)}</div>`}
function swapCase(c){
 const id='x'+c.cid,o=c.offer,mode=o.mode=='even'?'Even swap':o.mode=='buyer_adds'?'Requester adds '+(o.amount||0)+' ETB':o.mode=='seller_adds'?'Owner adds '+(o.amount||0)+' ETB':E(o.mode||'');
 const who=uid=>uid&&uid===c.C?'Owner':uid&&uid===c.F?'Requester':'?';
 const adder=o.mode=='buyer_adds'?'Requester':o.mode=='seller_adds'?'Owner':null;
 const PC=XS.party[c.C+':'+c.ref]||{},PF=XS.party[c.F+':'+c.ref]||{};
 const logins=!!(PC.login&&PC.login.ans&&PF.login&&PF.login.ans),codes=['2','3'].every(n=>(PC.codes||{})[n]&&PC.codes[n].ans&&(PF.codes||{})[n]&&PF.codes[n].ans);
 const step=!c.unlocked?'Unlock payment':!c.M.paid?'Payment':!logins?'Logins':!codes?'Codes':'Finish';
 let b=`<div class="pp"><b>🔁 Deal</b>${chip(mode)} ${o.ovr?chip('OVR '+E(o.ovr)):''}${o.note?`<div>${E(o.note)}</div>`:''}<div class="row" style="gap:6px;margin-top:6px">${(o.images||[]).map(q=>`<a href="${CFG.URL}/storage/v1/object/public/chat/${E(q)}" target="_blank"><img src="${CFG.URL}/storage/v1/object/public/chat/${E(q)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px"></a>`).join('')}</div></div>`;
 const due=[];if(adder)due.push(`<div>💵 <b>${adder}</b> must pay the added money: <b>${o.amount||0} ETB</b></div>`);
 due.push(`<div>🧾 eFootballET fee <b>100 ETB</b> → ${c.payer?`paid by <b>${who(c.payer)}</b>`:c.declined?'⚠️ declined, they must choose again':c.asked?'⏳ one asked the other to pay':'⏳ not chosen yet'}</div>`);
 b+=stp(1,'Payment',c.M.paid?'done':'now',`${due.join('')}${c.unlocked?'<div>🔓 Payment step is open for both users</div>':''}<div class="row">${c.unlocked?'':bt('🔓 Open payment (C & F choose who pays)',`xUnlock(${c.cid})`,'')}${c.M.paid?'':bt('✅ Payment received',`xPaid(${c.cid})`,c.unlocked?'':'s')}</div>${c.M.paid?`<div>✅ Received ${ago(c.M.paid)}</div>`:''}`);
 b+=stp(2,'Owner · login & codes',logins&&codes?'done':(c.M.paid?'now':'todo'),partyBlock(c,'Owner',c.C));
 b+=stp(3,'Requester · login & codes',logins&&codes?'done':(c.M.paid?'now':'todo'),partyBlock(c,'Requester',c.F));
 b+=stp(4,'Finish',logins&&codes?'now':'todo',`<div class="row">${bt('🎉 Swap completed',`xDone(${c.cid})`,'')}</div>`);
 return `<div class="cs simple${OPEN[id]?' open':''}" data-id="${id}"><div class="csh" onclick="tg('${id}')"><div class="m"><b>🔁 #${c.cid} · ${E(nameOf(c.F))} ⇄ ${E(nameOf(c.C))}</b><small>Swap · Requester ⇄ Owner · ${mode}</small></div>${chip(step)}<span class="ch">›</span></div><div class="csb">${b}</div></div>`}

async function ensurePush(quiet){if(!('Notification' in window)||Notification.permission!=='granted')return;await enablePush(quiet)}
async function enablePush(quiet){try{
 if(!('PushManager' in window))return quiet||alert('Push is not supported in this browser.');
 const p=await Notification.requestPermission();if(p!=='granted')return quiet||alert('Notifications were not allowed. Turn them on in phone Settings.');
 const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
 if(s&&localStorage.avk!==VAPID){await s.unsubscribe();s=null}localStorage.avk=VAPID;
 if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
 const j=s.toJSON();const r=await sb.rpc('save_push_admin',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
 if(r.error)return quiet||alert('Could not save: '+r.error.message+' (run migration29)');
 if(!quiet)alert('✅ Admin notifications are ON for this phone.');paint()}catch(e){quiet||alert('Error: '+e.message)}}
